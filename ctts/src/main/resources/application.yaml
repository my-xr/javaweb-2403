server:
  port: 8080
  servlet:
    context-path: /api

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ctts?characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

mybatis-plus:
  configuration:
    # SQL 日志输出（开发环境开启，生产关闭）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 驼峰命名映射（默认开启）
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      # 主键策略：AUTO 数据库自增
      id-type: AUTO
      # 逻辑删除（CTTS暂不启用，M5模块再启用）
      # logic-delete-field: deleted
      # logic-delete-value: 1
      # logic-not-delete-value: 0


